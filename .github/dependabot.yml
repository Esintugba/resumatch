version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-and-ef-core:
        patterns:
          - "Microsoft.*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "dotnet-ef"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0;
      # a major bump breaks the OpenAPI source generator.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

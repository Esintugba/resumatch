version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-and-ef-core:
        patterns:
          - "Microsoft.*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "dotnet-ef"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0;
      # a major bump breaks the OpenAPI source generator.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      build:
        patterns: ["vite", "@vitejs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
      test:
        patterns: ["vitest", "jsdom", "@testing-library/*", "@playwright/test"]
    ignore:
      # openapi-typescript 7 declares TypeScript ^5 as its peer dependency.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

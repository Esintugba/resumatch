name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it may be applying migrations or deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-tests:
    name: build-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore ResuMatch.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build ResuMatch.slnx --configuration Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test ResuMatch.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~API.Tests.Integration"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Check for model changes without a migration
        # dotnet-ef boots the application host, whose startup validation
        # requires a JWT key and a connection string. Neither is used to
        # compare the model, so throwaway values are generated per run.
        run: |
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          export ConnectionStrings__DefaultConnection="Host=localhost;Database=design_time;Username=none;Password=none"
          dotnet ef migrations has-pending-model-changes --project API --configuration Release --no-build

      - name: Check for vulnerable packages
        run: |
          set -o pipefail
          dotnet list ResuMatch.slnx package --vulnerable --include-transitive --format json | tee vulnerable.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' vulnerable.json)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count vulnerable package(s) found."
            exit 1
          fi

  integration-tests:
    name: integration-tests
    needs: build-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ResuMatch.slnx

      - name: Build
        run: dotnet build ResuMatch.slnx --configuration Release --no-restore -warnaserror

      - name: Integration tests
        run: >
          dotnet test ResuMatch.slnx --configuration Release --no-build
          --filter "FullyQualifiedName~API.Tests.Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  web-checks:
    name: web-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for vulnerable runtime packages
        run: npm audit --omit=dev

  api-contract:
    name: api-contract
    # Regenerates the OpenAPI document from a short local run of the API (no
    # database, no secrets, loopback only) and the TypeScript types from it.
    # Fails when the committed copies differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build API
        run: |
          dotnet restore API/API.csproj
          dotnet build API/API.csproj --configuration Release --no-restore

      - name: Install web tools
        working-directory: web
        run: npm ci

      - name: Generate the contract
        run: bash scripts/generate-api-contract.sh --no-build

      - name: Fail if the committed contract is out of date
        run: |
          if [ -n "$(git status --porcelain -- web/openapi web/src/api/schema.d.ts)" ]; then
            git --no-pager diff --stat -- web/openapi web/src/api/schema.d.ts
            git status --short -- web/openapi web/src/api/schema.d.ts
            echo "::error::The committed API contract is out of date. Run scripts/generate-api-contract.sh and commit web/openapi/v1.json and web/src/api/schema.d.ts."
            exit 1
          fi
          echo "The committed contract matches the API."

  deploy:
    name: deploy
    needs: [build-and-unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      # Design-time host settings only; never used to reach a real service.
      Jwt__Issuer: design-time
      Jwt__Audience: design-time
      Jwt__AccessTokenExpirationMinutes: 15
      ConnectionStrings__DefaultConnection: Host=localhost;Database=design_time;Username=none;Password=none
    steps:
      - name: Require deployment settings
        env:
          NEON_MIGRATION_CONNECTION_STRING: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in NEON_MIGRATION_CONNECTION_STRING RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it as a repository secret (see docs/operations/deployment.md)."
              missing=1
            fi
          done
          if ! [[ "$PRODUCTION_URL" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::Repository variable PRODUCTION_URL must be an https:// origin without a path or trailing slash."
            missing=1
          fi
          if ! printf '%s' "$NEON_MIGRATION_CONNECTION_STRING" | grep -qiE '(^|;) *ssl ?mode *= *verifyfull *(;|$)'; then
            echo "::error::NEON_MIGRATION_CONNECTION_STRING must use SSL Mode=VerifyFull."
            missing=1
          fi
          echo "Production URL: $PRODUCTION_URL"
          exit "$missing"

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build migration bundle
        # The bundle does not carry appsettings.json and dotnet-ef boots the
        # application host, whose startup validation needs JWT settings and
        # a connection string. Throwaway values are enough
        # here and in the next step; the real target is passed with --connection.
        run: |
          dotnet restore ResuMatch.slnx
          dotnet tool restore
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          dotnet ef migrations bundle --project API --configuration Release --target-runtime linux-x64 --output efbundle --force

      - name: Prove the migration connection validates certificates
        # A connection that trusts only an unrelated root must be rejected. If
        # validation were off, the bundle would connect and apply the pending
        # migrations, as the next step would, and this step then stops the deploy.
        env:
          NEON_MIGRATION_CONNECTION_STRING: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: |
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=unrelated-root" \
            -keyout "$RUNNER_TEMP/unrelated.key" -out "$RUNNER_TEMP/unrelated.pem" 2>/dev/null
          if output=$(timeout 180 ./efbundle --connection "${NEON_MIGRATION_CONNECTION_STRING%;};Root Certificate=$RUNNER_TEMP/unrelated.pem" 2>&1); then
            echo "::error::The connection succeeded with an unrelated root certificate, so the server certificate is not being validated."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -qi 'remote certificate'; then
            printf '%s\n' "$output"
            echo "::error::The connection failed, but not because of certificate validation."
            exit 1
          fi
          echo "Rejected as expected: the server certificate is validated."

      - name: Apply migrations
        env:
          NEON_MIGRATION_CONNECTION_STRING: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: |
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          ./efbundle --connection "$NEON_MIGRATION_CONNECTION_STRING"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA"

      - name: Wait for the new version
        # The previous instance keeps answering until the switch-over, so only
        # the reported commit proves the new version is live.
        run: |
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            commit=$(curl --silent --max-time 30 "$PRODUCTION_URL/health/version" | jq -r '.commit? // empty' 2>/dev/null || true)
            echo "/health/version: ${commit:-no answer}"
            [ "$commit" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "::error::$PRODUCTION_URL/health/version did not report $GITHUB_SHA within 20 minutes."
          exit 1

      - name: Wait for readiness
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$PRODUCTION_URL/health/ready" || true)
            echo "/health/ready: $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$PRODUCTION_URL/health/ready did not return 200 within 5 minutes."
          exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh "$PRODUCTION_URL"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it may be applying migrations or deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-tests:
    name: build-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore ResuMatch.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build ResuMatch.slnx --configuration Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test ResuMatch.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~API.Tests.Integration"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Check for model changes without a migration
        # dotnet-ef boots the application host, whose startup validation
        # requires a JWT key and a connection string. Neither is used to
        # compare the model, so throwaway values are generated per run.
        run: |
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          export ConnectionStrings__DefaultConnection="Host=localhost;Database=design_time;Username=none;Password=none"
          dotnet ef migrations has-pending-model-changes --project API --configuration Release --no-build

      - name: Check for vulnerable packages
        run: |
          set -o pipefail
          dotnet list ResuMatch.slnx package --vulnerable --include-transitive --format json | tee vulnerable.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' vulnerable.json)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count vulnerable package(s) found."
            exit 1
          fi

  integration-tests:
    name: integration-tests
    needs: build-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ResuMatch.slnx

      - name: Build
        run: dotnet build ResuMatch.slnx --configuration Release --no-restore -warnaserror

      - name: Integration tests
        run: >
          dotnet test ResuMatch.slnx --configuration Release --no-build
          --filter "FullyQualifiedName~API.Tests.Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  deploy:
    name: deploy
    needs: [build-and-unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://resumatch-api.onrender.com' }}
      # Design-time host settings only; never used to reach a real service.
      Jwt__Issuer: design-time
      Jwt__Audience: design-time
      Jwt__AccessTokenExpirationMinutes: 60
      ConnectionStrings__DefaultConnection: Host=localhost;Database=design_time;Username=none;Password=none
    steps:
      - name: Require deployment secrets
        env:
          NEON_MIGRATION_CONNECTION_STRING: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in NEON_MIGRATION_CONNECTION_STRING RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it as a repository secret (see docs/operations/deployment.md)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build migration bundle
        # The bundle does not carry appsettings.json and dotnet-ef boots the
        # application host, whose startup validation needs JWT settings and
        # a connection string. Throwaway values are enough
        # here and in the next step; the real target is passed with --connection.
        run: |
          dotnet restore ResuMatch.slnx
          dotnet tool restore
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          dotnet ef migrations bundle --project API --configuration Release --target-runtime linux-x64 --output efbundle --force

      - name: Apply migrations
        env:
          NEON_MIGRATION_CONNECTION_STRING: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: |
          export Jwt__SecretKey="$(openssl rand -base64 32)"
          ./efbundle --connection "$NEON_MIGRATION_CONNECTION_STRING"

      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response=$(curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA")
          echo "deploy_id=$(printf '%s' "$response" | jq -r '.deploy.id // .id // empty')" >> "$GITHUB_OUTPUT"
          echo "service_id=$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | grep -oE 'srv-[a-z0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version
        # The previous instance keeps answering until the switch-over, so only
        # the deploy status proves the new version is live.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          SERVICE_ID: ${{ steps.trigger.outputs.service_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$DEPLOY_ID" ] || [ -z "$SERVICE_ID" ]; then
            echo "::warning::Cannot read the deploy status. Waiting 5 minutes; the smoke test may reach the previous version."
            sleep 300
            exit 0
          fi

          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "Deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ended with status $status."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Render deploy."
          exit 1

      - name: Wait for readiness
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$PRODUCTION_URL/health/ready" || true)
            echo "/health/ready: $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$PRODUCTION_URL/health/ready did not return 200 within 5 minutes."
          exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh "$PRODUCTION_URL"
